<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="楽譜ビューア">
<meta name="theme-color" content="#111214">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
<title>楽譜ビューア</title>
</head>
<body>

<!-- ===== ライブラリ画面 ===== -->
<div id="app">
  <header class="topbar">
    <div class="top-left" id="topLeft"></div>
    <h1 id="title">楽譜</h1>
    <div class="top-right" id="topRight"></div>
  </header>
  <main id="main"></main>
  <nav class="tabbar">
    <button data-tab="library" class="active">
      <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      <span>楽譜</span>
    </button>
    <button data-tab="setlists">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
      <span>セットリスト</span>
    </button>
    <button data-tab="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span>設定</span>
    </button>
  </nav>
</div>

<!-- ===== 楽譜表示画面 ===== -->
<div id="reader" hidden>
  <div id="stage"></div>
  <div id="tapLayer"></div>

  <div class="rbar top" id="rTop">
    <button class="icon-btn" id="rClose" aria-label="閉じる">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="rtitle"><div id="rTitle"></div><div id="rSub"></div></div>
    <button class="icon-btn" id="rPrev" aria-label="前へ" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="icon-btn" id="rNext" aria-label="次へ" hidden><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="icon-btn" id="rPages" aria-label="ページの並べ替え">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>
    </button>
    <button class="icon-btn" id="rInk" aria-label="書き込み">
      <svg viewBox="0 0 24 24"><path d="M4 20l4-1 11-11-3-3L5 16l-1 4z"/><path d="M14 6l3 3"/></svg>
    </button>
  </div>

  <div class="rbar bottom" id="rBottom">
    <span id="rPage">1 / 1</span>
    <input type="range" id="rSlider" min="0" max="0" value="0" step="1">
  </div>

  <div class="inktools" id="inkTools" hidden>
    <button class="tool sel" data-tool="pen" data-color="#111111"><span class="dot" style="background:#111"></span></button>
    <button class="tool" data-tool="pen" data-color="#e0242c"><span class="dot" style="background:#e0242c"></span></button>
    <button class="tool" data-tool="pen" data-color="#1f5fe0"><span class="dot" style="background:#1f5fe0"></span></button>
    <button class="tool" data-tool="hl" data-color="#ffd400"><span class="dot hl"></span></button>
    <button class="tool" data-tool="eraser" aria-label="消しゴム">
      <svg viewBox="0 0 24 24"><path d="M16 3l5 5-11 11H5l-2-2z"/><path d="M10 19h11"/></svg>
    </button>
    <span class="sep"></span>
    <span class="sep"></span>
    <button id="inkWidth" aria-label="線の太さ">中</button>
    <button id="inkUndo" aria-label="元に戻す"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button id="inkDone" class="done">完了</button>
  </div>
</div>

<!-- ===== シート（並べ替え・選択など） ===== -->
<div id="sheet" class="backdrop" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <button id="sheetCancel">閉じる</button>
      <b id="sheetTitle"></b>
      <button id="sheetOk" class="strong"></button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </div>
</div>

<!-- ===== アクションシート ===== -->
<div id="action" class="backdrop" hidden>
  <div class="action">
    <div class="action-group" id="actionGroup"></div>
    <div class="action-group"><button id="actionCancel" class="strong">キャンセル</button></div>
  </div>
</div>

<div id="loading" hidden><div class="spinner"></div><div id="loadingText">読み込み中…</div></div>
<div id="toast" hidden></div>

<input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="replaceInput" accept="application/pdf,.pdf" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="app.js"></script>
</body>
</html>
